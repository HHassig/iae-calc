service: iae_calc
image: hhassig/iae_calc
# Traffic arrives via cloudflared -> kamal-proxy on :80 (Host-header routing).
# Do NOT add a direct `publish` port option: it is not used for serving and it
# makes every redeploy fail with "port is already allocated" while the old
# container still holds the port.
servers:
  web:
    hosts:
      - 100.119.170.114
proxy:
  ssl: false
  host: iae-calc.hassig.com
ssh:
  user: harrison

registry:
  server: localhost:5556
env:
  secret:
    - RAILS_MASTER_KEY
    - KAMAL_REGISTRY_PASSWORD
  clear:
    SOLID_QUEUE_IN_PUMA: true
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
volumes:
  - "iae_calc_storage:/rails/storage"
asset_path: /rails/public/assets
builder:
  arch: amd64
